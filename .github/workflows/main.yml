name: Build EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lantern-desktop/**'
      - '.github/workflows/main.yml'
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: lantern-desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v7
        with:
          name: lantern-exe
          path: lantern-desktop/dist/*.exe
